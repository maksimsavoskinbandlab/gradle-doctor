name: "Release"
on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  release:
    name: "Publish Release"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "liberica"
      - uses: gradle/actions/setup-gradle@v6
      - name: Publish Release to Bandlab repo
        env:
          BANDLAB_REPO_URL: ${{ secrets.BANDLAB_REPO }}
          ORG_GRADLE_PROJECT_bandlabRepoUsername: ${{ secrets.BANDLAB_REPO_LOGIN }}
          ORG_GRADLE_PROJECT_bandlabRepoPassword: ${{ secrets.BANDLAB_REPO_PASSWORD }}}
        run: ./gradlew :doctor-plugin:publishAllPublicationsToBandlabRepoRepository --no-configuration-cache